name: Build M30s A11 OneUI KSU + KPatch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses5-dev libtinfo5 git zip cpio python3 python-is-python3 tar wget curl

      - name: Enable KALLSYMS in Kernel Config
        run: |
          sed -i 's/\r$//' init/Kconfig kernel/configs/*.config arch/arm64/configs/* 2>/dev/null || true
          echo "CONFIG_KALLSYMS=y" >> kernel/configs/mint_variant_oneui.config
          echo "CONFIG_KALLSYMS_ALL=y" >> kernel/configs/mint_variant_oneui.config

      - name: Build and Inject KernelPatch 0.13.8 (Pre-GKI 4.14 Compatible)
        run: |
          # 1. Download official KernelPatch 0.13.8 kptools
          wget -q https://github.com/bmax121/KernelPatch/releases/download/0.13.8/kptools-linux
          chmod +x kptools-linux

          # 2. Download Arm toolchain used by KernelPatch
          wget -q https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -xf arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz

          # 3. Clone KernelPatch 0.13.8 source (contains 4.14 arm64 anchor bugfix commit 7671d6b)
          git clone --depth=1 -b 0.13.8 https://github.com/bmax121/KernelPatch.git kp_src

          # 4. Patch supercall.c: allow root (uid 0) bypass AND return KPatch-Next magic (0x20262026)
          python3 -c '
          with open("kp_src/kernel/patch/common/supercall.c", "r") as f:
              s = f.read()

          # 4a. Allow root without requiring superkey argument
          old_key = "    if (has_preset_superkey()) {"
          new_key = "    if (uid == 0) { is_trusted_caller = 1; is_authed = 1; } else if (has_preset_superkey()) {"
          assert old_key in s, "Superkey hook not found"
          s = s.replace(old_key, new_key, 1)

          # 4b. Return KPatch-Next hello magic (0x20262026)
          old_hello = "return SUPERCALL_HELLO_MAGIC;"
          new_hello = "return 0x20262026;"
          assert old_hello in s, "Hello magic not found"
          s = s.replace(old_hello, new_hello, 1)

          with open("kp_src/kernel/patch/common/supercall.c", "w") as f:
              f.write(s)
          '

          # 5. Compile kpimg
          export TARGET_COMPILE=$(pwd)/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-
          export ANDROID=1
          make -C kp_src/kernel hdr kpimg
          cp -f kp_src/kernel/kpimg ./kpimg-android

          # 6. Inject patching into build.sh with -s 12345678 (prevents random key early boot crash)
          python3 -c '
          with open("build.sh", "r") as f:
              content = f.read()

          target = "BUILD_KERNEL\nif [[ $BUILD_VARIANT == recovery ]]"
          replacement = """BUILD_KERNEL
          echo "=== EMBEDDING KPATCH INTO KERNEL IMAGE VIA DOCKER ==="
          docker run --rm -v "$TOP":/work -w /work ubuntu:24.04 /bin/bash -c "chmod +x /work/kptools-linux && /work/kptools-linux -p -i /work/arch/arm64/boot/Image -s \\\"12345678\\\" -k /work/kpimg-android -o /work/arch/arm64/boot/Image.patched"
          if [ -f "$TOP/arch/arm64/boot/Image.patched" ]; then
              mv -f "$TOP/arch/arm64/boot/Image.patched" "$TOP/arch/arm64/boot/Image"
              echo "=== KPATCH EMBEDDED SUCCESSFULLY ==="
          else
              echo "=== ERROR: KPATCH EMBED FAILED ==="
              exit 1
          fi
          if [[ $BUILD_VARIANT == recovery ]]"""

          assert target in content, "Target not found in build.sh"
          content = content.replace(target, replacement, 1)

          with open("build.sh", "w") as f:
              f.write(content)
          '

      - name: Build Kernel
        run: |
          chmod +x build.sh ksu.sh
          chmod -R +x tools/make/bin/
          ./build.sh -d m30s -a 11 -v oneui -k -p -c

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Mint-Kernel-M30s-A11-OneUI-KSU-KPatch
          path: out/*.zip