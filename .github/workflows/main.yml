name: Build M30s A11 OneUI KSU + KPatch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses5-dev libtinfo5 git zip cpio python3 python-is-python3 tar wget curl

      - name: Enable KALLSYMS in Kernel Config
        run: |
          sed -i 's/\r$//' init/Kconfig kernel/configs/*.config arch/arm64/configs/* 2>/dev/null || true
          echo "CONFIG_KALLSYMS=y" >> kernel/configs/mint_variant_oneui.config
          echo "CONFIG_KALLSYMS_ALL=y" >> kernel/configs/mint_variant_oneui.config

      - name: Prepare KernelPatch (Pre-GKI 4.14 Compatible + KPatch-Next Patched)
        run: |
          # 1. Download official KernelPatch 0.13.8 kptools and kpimg-android
          wget -q https://github.com/bmax121/KernelPatch/releases/download/0.13.8/kptools-linux
          chmod +x kptools-linux
          wget -q https://github.com/bmax121/KernelPatch/releases/download/0.13.8/kpimg-android

          # 2. Patch kpimg-android for KPatch-Next (superkey bypass + 0x20262026 magic)
          python3 -c '
          with open("kpimg-android", "rb") as f:
              data = bytearray(f.read())

          # Bypass superkey check, auto-authenticate caller
          data[0x103a0:0x103a8] = bytes.fromhex("3400805214000014")

          # Return 0x20262026 for SUPERCALL_HELLO and update KPM magic
          replacements = {
              0xbfe0: bytes.fromhex("c1048452c104a472"),
              0xc134: bytes.fromhex("c1048452c104a472"),
              0xc3e0: bytes.fromhex("c0048452c004a472"),
              0xc6bc: bytes.fromhex("c0048452c004a472"),
              0x10518: bytes.fromhex("c00484d2c004a4f2"),
              0x129d8: bytes.fromhex("c0048452c004a472"),
              0x12ca4: bytes.fromhex("c0048452c004a472"),
              0x12f18: bytes.fromhex("c1048452c104a472"),
          }
          for off, new_bytes in replacements.items():
              data[off:off+8] = new_bytes

          with open("kpimg-android", "wb") as f:
              f.write(data)
          print("Patched kpimg-android successfully")
          '

          # 3. Inject patching into build.sh with -s 12345678
          python3 -c '
          with open("build.sh", "r") as f:
              content = f.read()

          target = "BUILD_KERNEL\nif [[ $BUILD_VARIANT == recovery ]]"
          replacement = """BUILD_KERNEL
          echo "=== EMBEDDING KPATCH INTO KERNEL IMAGE VIA DOCKER ==="
          docker run --rm -v "$TOP":/work -w /work ubuntu:24.04 /bin/bash -c "chmod +x /work/kptools-linux && /work/kptools-linux -p -i /work/arch/arm64/boot/Image -s \\\"12345678\\\" -k /work/kpimg-android -o /work/arch/arm64/boot/Image.patched"
          if [ -f "$TOP/arch/arm64/boot/Image.patched" ]; then
              mv -f "$TOP/arch/arm64/boot/Image.patched" "$TOP/arch/arm64/boot/Image"
              echo "=== KPATCH EMBEDDED SUCCESSFULLY ==="
          else
              echo "=== ERROR: KPATCH EMBED FAILED ==="
              exit 1
          fi
          if [[ $BUILD_VARIANT == recovery ]]"""

          assert target in content, "Target not found in build.sh"
          content = content.replace(target, replacement, 1)

          with open("build.sh", "w") as f:
              f.write(content)
          '


      - name: Build Kernel
        run: |
          chmod +x build.sh ksu.sh
          chmod -R +x tools/make/bin/
          ./build.sh -d m30s -a 11 -v oneui -k -p -c

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Mint-Kernel-M30s-A11-OneUI-KSU-KPatch
          path: out/*.zip